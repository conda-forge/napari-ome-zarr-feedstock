{% set name = "napari-ome-zarr" %}
{% set version = "0.10.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 5fbfcbea0d1c603977550dbdf86a803c8684e0e68c90344bc39c6114f45abe95

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python >3.10
    - setuptools-scm
  run:
    - aiohttp
    - requests
    - zarr >=3.1.5
    - napari >=0.6.0
    - napari-plugin-engine >=0.1.4
    - numpy
    - ome-zarr >=0.13.0
    - python >3.10
    - vispy

test:
  imports:
    - napari_ome_zarr
  commands:
    - pip list
    - pip check
  requires:
    - pip
    - python >3.10

about:
  home: https://github.com/ome/napari-ome-zarr
  summary: A reader for zarr backed OME-NGFF images.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jburel
    - jaimergp
    - joshmoore
    - will-moore
    - jo-mueller
